<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Deployment Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            padding: 80px 20px;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }
        h1 { color: #2563eb; }
        p { color: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Continuous Deployment Demo</h1>
        <p>Hello! My HTML website is deployed successfully.</p>
        <p>Every GitHub update can trigger a new deployment.</p>
    </div>
</body>
</html>
